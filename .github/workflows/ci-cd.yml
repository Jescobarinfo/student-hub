# ============================================
# USS Student Hub - GitHub Actions CI/CD (v3)
# ============================================
# Autor: Johan Escobar Acosta
# Deploy: Backend → Lambda | Frontend → S3

name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, staging ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'
  AWS_REGION: 'us-east-1'
  S3_BUCKET: 'uss-student-hub-frontend'

# ==========================================
# BACKEND BUILD / LINT / TEST
# ==========================================
jobs:
  backend-build:
    name: 🏗️ Build Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - working-directory: backend
        run: npm install

      - working-directory: backend
        run: npm run build || echo "Build script not configured"

      - uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: backend/dist/
          retention-days: 7

  backend-lint:
    name: 🔍 Lint Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - working-directory: backend
        run: npm install

      - working-directory: backend
        run: npm run lint || echo "Lint not configured yet"

  backend-test:
    name: 🧪 Test Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - working-directory: backend
        run: npm install

      - working-directory: backend
        run: npm test -- --passWithNoTests || echo "No tests yet"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

# ==========================================
# FRONTEND BUILD / LINT
# ==========================================
  frontend-build:
    name: 🏗️ Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - working-directory: frontend
        run: npm install

      - working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://fqttaemgp7.execute-api.us-east-1.amazonaws.com/prod

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/out/
          retention-days: 7

  frontend-lint:
    name: 🔍 Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - working-directory: frontend
        run: npm install

      - working-directory: frontend
        run: npm run lint

# ==========================================
# SECURITY SCAN
# ==========================================
  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - working-directory: backend
        run: npm install && npm audit --audit-level=high || true

      - working-directory: frontend
        run: npm install && npm audit --audit-level=high || true

# ==========================================
# DEPLOY
# ==========================================
  deploy-prod:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: [backend-build, backend-test, frontend-build, security-scan]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: http://uss-student-hub-frontend.s3-website-us-east-1.amazonaws.com

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      # Backend deploy
      - name: 📥 Install backend dependencies
        working-directory: backend
        run: npm ci --production=false

      - name: 🔍 Debug backend folder
        working-directory: backend
        run: ls -la

      - name: 🚀 Deploy Lambda Functions
        working-directory: backend
        run: node deploy-lambdas.js

      - name: 🧪 Test Backend API
        run: |
          echo "Testing API…"
          sleep 5
          curl -X GET -f https://fqttaemgp7.execute-api.us-east-1.amazonaws.com/prod/notifications?studentId=12345678-9 \
          || echo "⚠️ API test skipped"

      # Frontend deploy
      - name: 📥 Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/out

      - name: 📤 Deploy Frontend to S3
        run: aws s3 sync frontend/out/ s3://${{ env.S3_BUCKET }} --delete --exact-timestamps

      - name: ☁️ Setup CloudFront (if needed)
        continue-on-error: true
        working-directory: backend
        run: |
          DIST=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Comment=='USS Student Hub'].Id" \
            --output text 2>/dev/null || echo "")
          if [ "$DIST" = "" ]; then
            echo "📦 CloudFront distribution not found. Creating..."
            npm install
            node setup-cloudfront.js
          else
            echo "✅ CloudFront distribution already exists: $DIST"
          fi

      - name: 🔄 Invalidate CloudFront Cache
        continue-on-error: true
        run: |
          DIST=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Comment=='USS Student Hub'].Id" \
            --output text 2>/dev/null || echo "")
          if [ "$DIST" != "" ]; then
            echo "🔄 Invalidating cache for distribution: $DIST"
            aws cloudfront create-invalidation --distribution-id $DIST --paths "/*"
            echo "✅ Cache invalidated successfully"
          else
            echo "⚠️ CloudFront distribution not found - skipping cache invalidation"
          fi

      - name: ✅ Deployment Summary
        run: |
          echo "🎉 Deployment completed!"
          echo ""
          echo "📍 URLs:"
          echo "  Backend:  https://fqttaemgp7.execute-api.us-east-1.amazonaws.com/prod"
          echo "  Frontend: http://${{ env.S3_BUCKET }}.s3-website-us-east-1.amazonaws.com"
          echo ""
          DIST=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Comment=='USS Student Hub'].DomainName" \
            --output text 2>/dev/null || echo "")
          if [ "$DIST" != "" ]; then
            echo "  CloudFront: https://$DIST (✅ HTTPS enabled)"
            echo ""
            echo "💡 Use the CloudFront URL for production access"
          else
            echo ""
            echo "⚠️ CloudFront not configured yet. Run: cd backend && node setup-cloudfront.js"
          fi
